llm:
  provider: openrouter            # openrouter | zenmux | none
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY # or ZENMUX_API_KEY
  models: ["google/gemma-4-31b-it:free", "openai/gpt-oss-20b:free", "nvidia/nemotron-3-super-120b-a12b:free"]
  temperature: 0.8
  max_tokens: 8192
  timeout_sec: 90
  retry_delays: [1, 2, 4]         # exponential backoff (s) on 429/5xx per model

tts:
  engine: edge-tts                # edge-tts | openrouter
  voice: en-US-ChristopherNeural
  rate: "+0%"
  pitch: "-2Hz"
  boundary: WordBoundary          # edge-tts word timing mode
  openrouter_model: deepgram/flux-tts:free

image:
  provider: pollinations
  base_url: https://image.pollinations.ai/prompt
  width: 1920
  height: 1080
  model: flux
  fallback_models: [turbo, sdxl]  # tried with new seeds if the primary model fails
  nologo: true
  seed: 42
  timeout_sec: 180
  # prepended to EVERY scene prompt so all frames share one consistent art style
  style_prefix: "modern chinese manhua art style, urban romance webtoon, semi-realistic 2D anime illustration, soft cel shading, delicate expressive faces, warm cinematic interior lighting, gentle amber glow, emotional atmosphere, high detail, 8k resolution, clean line art"
  # appended to EVERY scene prompt so the protagonist looks the same across scenes
  character: "beautiful pale 24yo woman with long brown hair, teary almond eyes, faint blush, delicate features"
  hf_base_url: https://api-inference.huggingface.co
  hf_model: black-forest-labs/FLUX.1-schnell
  hf_api_key_env: HF_API_KEY      # optional; enables Hugging Face Serverless fallback

video:
  fps: 24
  codec: libx264
  preset: veryfast
  crf: 23
  audio_bitrate: 192k
  bgm_volume_db: -24
  duck_db: 10
  min_scene_sec: 3
  max_scene_sec: 60               # safety cap only; narration drives scene length
  burn_subtitles: false
  font_file: arial.ttf

paths:
  scripts_dir: workspace/scripts
  audio_dir: workspace/audio
  images_dir: workspace/images
  output_dir: workspace/output
